<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="spot" cx="55%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="facet1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#spot)"/>
  <!-- Architectural Light Beam -->
  <polygon points="390,0 600,0 600,520 260,520" fill="#ffffff" opacity="0.06"/>
  <!-- Pedestal -->
  <rect x="190" y="480" width="220" height="320" fill="#0d0d0d" stroke="#2c2c2c" stroke-width="1"/>
  <polygon points="190,480 230,455 450,455 410,480" fill="#242424"/>
  <!-- Large Faceted Gemstone Sculpture -->
  <g transform="translate(300, 310)">
    <polygon points="0,-165 125,-65 95,115 -95,115 -125,-65" fill="#1b1b1b" stroke="#e5e5e5" stroke-width="1.5"/>
    <polygon points="0,-165 55,-60 0,35 -55,-60" fill="url(#facet1)" opacity="0.9"/>
    <polygon points="0,-165 125,-65 55,-60" fill="#d4d4d4" opacity="0.65"/>
    <polygon points="0,-165 -125,-65 -55,-60" fill="#737373" opacity="0.65"/>
    <polygon points="-125,-65 -55,-60 0,35 -95,115" fill="#404040"/>
    <polygon points="125,-65 55,-60 0,35 95,115" fill="#a3a3a3" opacity="0.75"/>
    <polygon points="0,35 95,115 -95,115" fill="#262626"/>
    <circle cx="0" cy="-65" r="3" fill="#ffffff"/>
  </g>
  <!-- Editorial Caption Lines -->
  <text x="48" y="748" fill="#737373" font-family="sans-serif" font-size="13" letter-spacing="4">SPECIMEN NO. 04 — CLARITY STUDY</text>
</svg>

