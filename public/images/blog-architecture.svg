    <line x1="295" y1="45" x2="275" y2="450"/>
    <line x1="295" y1="45" x2="315" y2="450"/>
    <line x1="262" y1="220" x2="352" y2="220"/>
    <line x1="250" y1="290" x2="349" y2="290"/>
    <line x1="238" y1="360" x2="347" y2="360"/>
    <line x1="40" y1="150" x2="178" y2="205"/>
    <line x1="30" y1="210" x2="172" y2="262"/>
    <line x1="20" y1="270" x2="166" y2="320"/>
  </g>
</svg>

