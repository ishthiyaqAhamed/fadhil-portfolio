  </defs>
  <rect width="600" height="450" fill="url(#sky2)"/>
  <!-- Left Tower -->
  <polygon points="0,80 185,155 150,450 0,450" fill="#161616"/>
  <polygon points="185,155 215,175 185,450 150,450" fill="#2e2e2e"/>
  <!-- Center Spire -->
