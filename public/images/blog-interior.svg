<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#e8e8e8"/>
  <!-- Left Wall -->
  <polygon points="0,0 260,70 260,330 0,400" fill="#212121"/>
  <!-- Back Wall -->
  <rect x="260" y="70" width="380" height="260" fill="#f5f5f5"/>
  <!-- Right Wall -->
  <polygon points="640,70 900,0 900,400 640,330" fill="#b8b8b8"/>
  <!-- Floor -->
  <polygon points="0,400 260,330 640,330 900,400" fill="#d4d4d4"/>
  <!-- Display Cases -->
  <rect x="330" y="190" width="110" height="140" fill="#171717"/>
  <rect x="342" y="135" width="86" height="55" fill="none" stroke="#171717" stroke-width="1.5"/>
  <polygon points="385,148 402,163 385,178 368,163" fill="#404040"/>
  <rect x="490" y="150" width="75" height="180" fill="none" stroke="#262626" stroke-width="2"/>
  <line x1="527" y1="150" x2="527" y2="330" stroke="#262626" stroke-width="1"/>
  <!-- Subtle Grid Tile Lines on Back Wall -->
  <g stroke="#111111" stroke-opacity="0.08" stroke-width="1">
    <line x1="260" y1="135" x2="640" y2="135"/>
    <line x1="260" y1="200" x2="640" y2="200"/>
    <line x1="260" y1="265" x2="640" y2="265"/>
  </g>
</svg>

